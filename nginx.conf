server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    charset utf-8;
    charset_types text/css application/javascript image/svg+xml;

    # Static files; clean 404 for anything missing (e.g. the optional
    # .image-slots.state.json sidecar, which the page handles gracefully).
    location / {
        try_files $uri $uri/ =404;
    }

    # Long cache for fingerprinted fonts and images.
    location ~* \.(woff2|woff|ttf|otf|jpg|jpeg|png|webp|avif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
